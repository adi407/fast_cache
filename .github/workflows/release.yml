name: Release

# Fires on a version tag. Everything here is irreversible in one direction or another — a Maven Central
# version can never be deleted or overwritten, and a PyPI filename can never be reused — so the full test
# suite runs first and the Maven side stops at a validated draft for a human to approve.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and sign everything, but publish nothing'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------------------------------
  # Nothing ships that has not passed the same suite CI runs on every push.
  # ---------------------------------------------------------------------------------------------------
  verify:
    name: Verify before releasing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Java tests
        run: mvn -B -ntp verify

      - name: Confirm the tag matches the project version
        # A tag that disagrees with the poms publishes a version nobody can find from the release notes,
        # and on Central that mistake is permanent.
        id: version
        run: |
          project=$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)
          python_version=$(grep -m1 '^version = ' python/pyproject.toml | cut -d'"' -f2)
          echo "version=$project" >> "$GITHUB_OUTPUT"
          echo "pom=$project  pyproject=$python_version"

          if [ "$project" != "$python_version" ]; then
            echo "::error::pom.xml ($project) and pyproject.toml ($python_version) disagree"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            [ "$tag_version" = "$project" ] \
              || { echo "::error::tag $GITHUB_REF_NAME does not match project version $project"; exit 1; }
          fi

      - name: Python tests
        working-directory: python
        env:
          FASTCACHE_JAR: ${{ github.workspace }}/fastcache-engine/target/fastcache-engine.jar
          FASTCACHE_METRICS_PORT: '0'
        run: |
          mkdir -p fastcache_ai/_bin
          cp "$FASTCACHE_JAR" fastcache_ai/_bin/
          pip install -e ".[dev]"
          pytest -q

  # ---------------------------------------------------------------------------------------------------
  # Maven Central, via the Sonatype Central Portal.
  # ---------------------------------------------------------------------------------------------------
  maven:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    environment: maven-central     # Lets you require a manual approval on this step.

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK and import the signing key
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          # Generates ~/.m2/settings.xml with a <server id="central"> whose credentials come from the
          # env vars named here, and imports the GPG key so maven-gpg-plugin can sign.
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Deploy
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        # Tests already ran in `verify`; re-running them here would only add a way for a flaky test to
        # fail a release whose artifacts are already proven good.
        run: mvn -B -ntp -Prelease -DskipTests deploy

      - name: Dry run (build and sign, publish nothing)
        if: ${{ github.event_name != 'push' && inputs.dry_run }}
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        # `verify`, not `deploy` with a skip flag. The publishing plugin is a build extension, so a
        # `deploy` invocation depends on one property being spelled exactly right to avoid contacting
        # Central - and if that spelling is ever wrong, a "dry" run silently creates a real
        # deployment. Stopping at `verify` cannot reach the network by construction, which is the only
        # guarantee worth having. It still proves what this run exists to prove: the key imports, the
        # passphrase is right, and every artifact signs.
        run: |
          mvn -B -ntp -Prelease -DskipTests verify
          echo '--- signatures produced (one per artifact) ---'
          find . -name '*.asc' | sort
          count=$(find . -name '*.asc' | wc -l)
          [ "$count" -ge 6 ] || { echo "::error::expected at least 6 signatures, found $count"; exit 1; }
          echo '--- verifying a signature against the imported key ---'
          gpg --verify fastcache-engine/target/fastcache-engine.jar.asc fastcache-engine/target/fastcache-engine.jar

      - name: Report
        run: |
          echo "### Maven Central" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Version \`${{ needs.verify.outputs.version }}\` uploaded as a **validated draft**." >> "$GITHUB_STEP_SUMMARY"
          echo "Publishing is deliberately manual: open" >> "$GITHUB_STEP_SUMMARY"
          echo "<https://central.sonatype.com/publishing/deployments> and click Publish." >> "$GITHUB_STEP_SUMMARY"
          echo "Once published the version is permanent and cannot be deleted or replaced." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------------------
  # PyPI, via Trusted Publishing. No API token exists to leak: GitHub mints a short-lived OIDC identity
  # and PyPI verifies it came from this repo, this workflow, this environment.
  # ---------------------------------------------------------------------------------------------------
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    environment: pypi
    permissions:
      id-token: write            # Required for Trusted Publishing; nothing else needs it.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the engine and bundle it into the wheel
        run: |
          mvn -B -ntp -DskipTests package
          mkdir -p python/fastcache_ai/_bin
          cp fastcache-engine/target/fastcache-engine.jar python/fastcache_ai/_bin/

      - name: Build the wheel and sdist
        working-directory: python
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify the distributions before anything is uploaded
        # A PyPI filename can never be reused, so a wheel missing its engine or its description is a
        # version burned forever. Cheaper to check twice.
        working-directory: python
        run: |
          pip install twine
          twine check dist/*

          wheel=$(ls dist/*.whl)
          unzip -l "$wheel" | grep -q 'fastcache_ai/_bin/fastcache-engine.jar' \
            || { echo "::error::the sidecar JAR is missing from the wheel"; exit 1; }
          echo "wheel contains the engine and passes twine check"

      - name: Publish
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          print-hash: true

      - name: Report
        run: |
          echo "### PyPI" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`pip install fastcache-ai==${{ needs.verify.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------------------
  # The GitHub Release, last: it should describe something that actually shipped.
  # ---------------------------------------------------------------------------------------------------
  github-release:
    name: Create the GitHub Release
    runs-on: ubuntu-latest
    needs: [verify, maven, pypi]
    if: github.event_name == 'push'
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # Needed to diff against the previous tag for release notes.

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build the attachable artifacts
        run: mvn -B -ntp -DskipTests package

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
          {
            echo "## Install"
            echo
            echo '```bash'
            echo "pip install fastcache-ai==${VERSION}"
            echo '```'
            echo
            echo '```xml'
            echo '<dependency>'
            echo '  <groupId>io.github.adi407</groupId>'
            echo '  <artifactId>fastcache-spring-boot-starter</artifactId>'
            echo "  <version>${VERSION}</version>"
            echo '</dependency>'
            echo '```'
            echo
            echo "## Changes"
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --pretty='- %s' "${previous}..${GITHUB_REF_NAME}"
            else
              echo "- Initial release"
            fi
          } > notes.md

          gh release create "${GITHUB_REF_NAME}" \
            --title "FastCache ${VERSION}" \
            --notes-file notes.md \
            fastcache-engine/target/fastcache-engine.jar
