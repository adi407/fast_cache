name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push supersedes an in-flight run for the same ref. The suites boot real JVMs and bind real
# sockets, so leaving stale runs racing against new ones wastes runners and muddies results.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests must never touch a developer's real ~/.fastcache, and must never fight over a fixed console
  # port. Port 0 asks the OS for an ephemeral one.
  FASTCACHE_METRICS_PORT: "0"
  FASTCACHE_EPHEMERAL: "1"

jobs:
  # ---------------------------------------------------------------------------------------------------
  # The Java engine and the Spring starter, on every platform we claim to support.
  # ---------------------------------------------------------------------------------------------------
  java:
    name: Java ${{ matrix.java }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false        # One platform failing must not hide the state of the others.
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ['21']

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Verify the sidecar JAR is executable
        # The published artifact must be runnable with `java -jar`. Shading once produced a second jar
        # and left the real artifact without a Main-Class, which this step would have caught.
        run: java -jar fastcache-engine/target/fastcache-engine.jar --help

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.os }}-java${{ matrix.java }}
          path: '**/target/surefire-reports/**'
          retention-days: 7

      - name: Publish the sidecar JAR for the Python jobs
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-jar
          path: fastcache-engine/target/fastcache-engine.jar
          retention-days: 1

  # ---------------------------------------------------------------------------------------------------
  # Forward-compatibility canary. Advisory: a new JDK breaking us should be visible, not blocking.
  # ---------------------------------------------------------------------------------------------------
  java-next:
    name: Java ${{ matrix.java }} (canary)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      matrix:
        java: ['25']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B -ntp verify

  # ---------------------------------------------------------------------------------------------------
  # The Python client, against a real sidecar. These are the tests that exercise the POSIX paths
  # (fcntl locking, process groups, SIGKILL) that a Windows-only developer cannot reach.
  # ---------------------------------------------------------------------------------------------------
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: java
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Min and max supported interpreters on every platform, plus the versions in between on Linux.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        # The client boots a JVM sidecar, so the Python jobs need a runtime too.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Download the sidecar JAR
        uses: actions/download-artifact@v4
        with:
          name: sidecar-jar
          path: python/fastcache_ai/_bin

      - name: Install the client
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the integration suite
        working-directory: python
        env:
          # Point the autopilot at the JAR we just downloaded rather than relying on the dev-tree fallback.
          FASTCACHE_JAR: ${{ github.workspace }}/python/fastcache_ai/_bin/fastcache-engine.jar
        run: pytest -q --durations=10

      - name: Dump sidecar log on failure
        # Almost every Python failure is really a sidecar that refused to start. The log says why, and
        # without this step the CI output shows only an unhelpful "could not reach sidecar".
        if: failure()
        shell: bash
        run: |
          echo "--- sidecar logs ---"
          find "${TMPDIR:-/tmp}" "$RUNNER_TEMP" -name 'sidecar.log' 2>/dev/null | while read -r log; do
            echo "== $log =="
            cat "$log"
          done || echo "(no sidecar log found)"

  # ---------------------------------------------------------------------------------------------------
  # Packaging: the wheel must actually build and import, on a clean interpreter with no source tree.
  # ---------------------------------------------------------------------------------------------------
  package:
    name: Wheel builds and imports cleanly
    runs-on: ubuntu-latest
    needs: java
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download the sidecar JAR
        uses: actions/download-artifact@v4
        with:
          name: sidecar-jar
          path: python/fastcache_ai/_bin

      - name: Build the wheel
        working-directory: python
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Confirm the JAR is inside the wheel
        # The zero-infrastructure promise depends on the engine shipping *in* the wheel. If this
        # regresses, `pip install` succeeds and then every cache call silently fails to find an engine.
        working-directory: python
        run: |
          wheel=$(ls dist/*.whl)
          echo "inspecting $wheel"
          unzip -l "$wheel" | grep -q 'fastcache_ai/_bin/fastcache-engine.jar' \
            || { echo "::error::the sidecar JAR is missing from the wheel"; unzip -l "$wheel"; exit 1; }

      - name: Confirm the PyPI page will not be blank
        # `readme` once pointed at a file that did not exist, which builds happily and publishes a project
        # page with no description at all. Nothing surfaces that until it is live on PyPI.
        working-directory: python
        run: |
          wheel=$(ls dist/*.whl)
          metadata=$(unzip -p "$wheel" '*.dist-info/METADATA')
          lines=$(printf '%s\n' "$metadata" | wc -l)
          echo "METADATA is $lines lines"
          [ "$lines" -gt 40 ] \
            || { echo "::error::wheel METADATA has no long description; the PyPI page would be empty"; exit 1; }
          printf '%s\n' "$metadata" | grep -q 'License-Expression: Apache-2.0' \
            || { echo "::error::licence metadata missing from the wheel"; exit 1; }

      - name: Install the wheel somewhere with no source tree and use it
        run: |
          mkdir -p /tmp/clean && cd /tmp/clean
          python -m venv .venv && . .venv/bin/activate
          pip install "$GITHUB_WORKSPACE"/python/dist/*.whl
          # Import from a directory containing no FastCache source, so this proves the package works
          # as installed rather than as a happy accident of the repository layout.
          python - <<'PY'
          import fastcache_ai as fc

          fc.ensure_sidecar()
          assert fc.ping(), "sidecar did not answer"
          fc.put("k", "hello from a wheel")
          assert fc.get("k") == "hello from a wheel"
          print("wheel import + round trip OK, version", fc.__version__)
          fc.shutdown_sidecar()
          PY

      - name: Check Maven Central metadata is present
        # Sonatype rejects a deploy that is missing any of these, and it is much cheaper to find out here
        # than at release time.
        run: |
          for field in url licenses developers scm; do
            grep -q "<$field>" pom.xml || { echo "::error::pom.xml is missing <$field>"; exit 1; }
          done
          echo "licence, developer and scm metadata present"
