[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastcache-ai"
version = "1.0.0"
description = "Zero-infrastructure, off-heap, virtual-threaded cache for AI workloads"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["cache", "llm", "embeddings", "sidecar", "off-heap"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# No hard dependencies on purpose. The client works on a bare interpreter with the standard library
# alone; every accelerator below is detected at import and used if present.
dependencies = []

[project.optional-dependencies]
# Recommended install: pip install "fastcache-ai[fast]"
fast = ["zstandard>=0.21", "msgpack>=1.0"]
numpy = ["numpy>=1.23"]
# Bundles a JRE for machines without one, so `pip install` really is the only setup step.
jre = ["jdk4py>=21"]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23", "numpy>=1.23", "msgpack>=1.0", "zstandard>=0.21"]

[project.urls]
Homepage = "https://github.com/fastcache/fastcache"

[tool.setuptools]
packages = ["fastcache"]

[tool.setuptools.package-data]
# The engine JAR ships inside the wheel; this is what makes the sidecar boot with no external download.
fastcache = ["_bin/*.jar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
