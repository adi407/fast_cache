# Redis configuration for the final 10 MiB end-to-end validation.
#
# Deliberately identical in spirit to docs/validation/data/redis-linux.conf, which produced the
# microbenchmark numbers this experiment is testing. Changing Redis's configuration between the
# microbenchmark and the end-to-end run would make any difference between them unattributable.

bind 127.0.0.1
protected-mode no

# FastCache is non-durable and writes nothing to disk. Leaving RDB snapshotting on would charge Redis
# for a feature FastCache does not offer and this experiment does not use.
save ""
appendonly no

# 10 MiB values, encoded with a small header on top. The default already covers this; stated for the
# record so nobody has to check.
proto-max-bulk-len 512mb

# Bounded LRU cache semantics, matching Caffeine's maximumWeight and FastCache's off-heap budget.
# The working set is 510 MiB, so this does not bind for any arm and no arm evicts.
maxmemory 2gb
maxmemory-policy allkeys-lru

# io-threads 4 with do-reads: the configuration most favourable to Redis that the previous round tested.
# The microbenchmark found it made no material difference at 10 MiB (ratio 0.24 either way); it is
# enabled here so that if the end-to-end result disagrees, it cannot be blamed on Redis being left
# single-threaded.
io-threads 4
io-threads-do-reads yes

loglevel warning
daemonize no
